apply plugin: 'com.android.application'

// Google's sample AdMob app ID: always serves test ads. Debug builds use it;
// release builds must get the real ID from ADMOB_APP_ID (see the guard below).
def TEST_ADMOB_APP_ID = 'ca-app-pub-3940256099942544~3347511713'
def appVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def buildNumber = System.getenv("VERSION_CODE") ?: "1"

android {
    namespace = "com.loanrealityindia.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.loanrealityindia.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI passes VERSION_CODE (the GitHub run number) so every build can be installed over the previous one.
        versionCode buildNumber.toInteger()
        versionName "${appVersion} (${buildNumber})"
        manifestPlaceholders = [admobAppId: System.getenv("ADMOB_APP_ID") ?: TEST_ADMOB_APP_ID]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing is read from environment variables (set as GitHub secrets),
    // so no keystore or password is ever committed to the repository.
    def releaseKeystore = System.getenv("ANDROID_KEYSTORE_FILE")
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Release guard: a Play Store build must never ship Google's test AdMob ID
// (it would earn nothing). Debug builds are unaffected.
gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(assemble|bundle|package|install)Release/
    }
    if (releasing) {
        def id = System.getenv("ADMOB_APP_ID") ?: ""
        if (!(id ==~ /ca-app-pub-\d{16}~\d{10}/) || id.contains("3940256099942544")) {
            throw new GradleException(
                "Release builds need the real AdMob app ID in ADMOB_APP_ID (got '${id ?: 'nothing'}'). " +
                "Build a debug APK for testing, or run the Release workflow with the AdMob variables set.")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
