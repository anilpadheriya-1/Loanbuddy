name: Android APK

# Builds the Android app (Capacitor wrapper around the web app) on GitHub's
# servers, which already have the Android SDK installed.
#
# Every successful build:
#   - uploads the APK as a workflow artifact, and
#   - refreshes the "android-latest" pre-release, so the newest test APK can be
#     downloaded from the Releases page (also on a phone).
# If signing secrets are configured, it also builds a signed release APK and
# an .aab bundle for the Play Store.

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (calculation engine, content rules, UI)
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Copy web app into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/loan-reality-india-debug.apk"

      - name: Build signed release APK and Play Store bundle
        if: env.HAS_SIGNING == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/loan-reality-india-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/loan-reality-india-release.aab"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loan-reality-india-android-${{ github.run_number }}
          path: |
            loan-reality-india-debug.apk
            loan-reality-india-release.apk
            loan-reality-india-release.aab
          if-no-files-found: warn

      - name: Publish "android-latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="loan-reality-india-debug.apk"
          [ -f loan-reality-india-release.apk ] && files="$files loan-reality-india-release.apk"
          gh release delete android-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create android-latest $files \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android test build #${{ github.run_number }}" \
            --notes "Latest Android build of Loan Reality India from \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}).

          Install: download **loan-reality-india-debug.apk** on your Android phone, open it, and allow installing from this source when asked.
          The debug APK is for testing. For the Play Store, add signing secrets to get a signed release APK/AAB."
