name: Android APK

# Builds the Android app (Capacitor wrapper around the web app) on GitHub's
# servers, which already have the Android SDK installed.
#
# Every successful build:
#   - uploads the APK as a workflow artifact, and
#   - refreshes the "android-latest" pre-release, so the newest test APK can be
#     downloaded from the Releases page (also on a phone).
# If signing secrets are configured, it also builds a signed release APK and
# an .aab bundle for the Play Store.

on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (calculation engine, content rules, UI)
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Copy web app into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/loan-reality-india-debug.apk"

      - name: Build signed release APK and Play Store bundle
        if: env.HAS_SIGNING == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/loan-reality-india-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/loan-reality-india-release.aab"

      - name: Resolve the Android dependency graph
        working-directory: android
        run: |
          for c in debugRuntimeClasspath releaseRuntimeClasspath; do
            ./gradlew :app:dependencies --configuration "$c" --no-daemon -q
          done > "$RUNNER_TEMP/gradle-deps.txt"
          wc -l "$RUNNER_TEMP/gradle-deps.txt"

      # Fails the build if any ad SDK, ad-network domain or unexpected permission
      # is found in the compiled code, the bundled web app or the dependency graph.
      - name: Verify the APK is ad-free
        run: |
          files="loan-reality-india-debug.apk"
          [ -f loan-reality-india-release.apk ] && files="$files loan-reality-india-release.apk"
          [ -f loan-reality-india-release.aab ] && files="$files loan-reality-india-release.aab"
          node scripts/verify-apk.mjs $files --gradle-deps "$RUNNER_TEMP/gradle-deps.txt" --report apk-verification.md
          {
            echo ""
            echo "- Version code: ${VERSION_CODE} (versionName 1.0.${VERSION_CODE})"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Branch: ${GITHUB_REF_NAME}"
          } >> apk-verification.md
          sha256sum loan-reality-india-*.apk loan-reality-india-*.aab 2>/dev/null | tee SHA256SUMS.txt
          cat apk-verification.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: loan-reality-india-android-${{ github.run_number }}
          path: |
            loan-reality-india-debug.apk
            loan-reality-india-release.apk
            loan-reality-india-release.aab
            apk-verification.md
            SHA256SUMS.txt
          if-no-files-found: warn

      - name: Publish "android-latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="loan-reality-india-debug.apk SHA256SUMS.txt apk-verification.md"
          [ -f loan-reality-india-release.apk ] && files="$files loan-reality-india-release.apk"
          {
            echo "Latest Android build of Loan Reality India from \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7})."
            echo ""
            echo "Install: download **loan-reality-india-debug.apk** on your Android phone, open it, and allow installing from this source when asked."
            echo "The debug APK is for testing. For the Play Store, add signing secrets to get a signed release APK/AAB."
            echo ""
            echo "This app contains no ads. Only install the APK from this page, and check its SHA-256 against the list below."
            echo ""
            cat apk-verification.md
          } > "$RUNNER_TEMP/notes.md"
          gh release delete android-latest --cleanup-tag --yes 2>/dev/null || true
          gh release create android-latest $files \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android test build #${{ github.run_number }}" \
            --notes-file "$RUNNER_TEMP/notes.md"
