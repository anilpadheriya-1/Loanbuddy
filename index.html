<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loan Reality India — Know what your loan really costs</title>
    <meta
      name="description"
      content="Calculate the real cost of your Indian loan after processing fees, GST, insurance, deductions and EMI structure. Educational, private, no sign-up."
    />
    <meta name="theme-color" content="#0b2a5b" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="Loan Reality India" />
    <meta property="og:description" content="Know what your loan REALLY costs." />
    <meta property="og:type" content="website" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('lri.theme')
        if (t === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Loan Reality India needs JavaScript to run the loan calculator.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
